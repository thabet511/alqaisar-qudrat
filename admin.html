<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل الأسئلة - القيصر</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f5f5f5; }
        
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        
        .login-box h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .error { color: #d32f2f; font-size: 14px; margin-top: 5px; }
        .success { color: #388e3c; font-size: 14px; margin-top: 5px; }
        
        .editor-container { display: none; padding: 20px; background: white; min-height: 100vh; }
        .editor-container.active { display: block; }
        
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 15px;
        }
        
        .editor-header h1 { color: #333; }
        .logout-btn {
            padding: 8px 15px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        
        .search-box input {
            flex: 1;
        }
        
        .search-box button {
            padding: 12px 20px;
            width: auto;
        }
        
        .question-form {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            margin-bottom: 20px;
        }
        
        .question-form .form-group { margin-bottom: 15px; }
        .question-form textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            font-family: inherit;
            min-height: 100px;
            resize: vertical;
        }
        
        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .choice-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .choice-input input {
            flex: 1;
        }
        
        .answer-select {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .answer-btn {
            padding: 10px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .answer-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .save-btn {
            width: 100%;
            padding: 12px;
            background: #388e3c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .save-btn:hover { background: #2e7d32; }
        
        .status { margin-top: 10px; padding: 10px; border-radius: 5px; display: none; }
        .status.success { background: #c8e6c9; color: #2e7d32; display: block; }
        .status.error { background: #ffcdd2; color: #c62828; display: block; }
        
        .loading { text-align: center; color: #999; }
    </style>
</head>
<body>
    <!-- Login Container -->
    <div id="loginContainer" class="login-container">
        <div class="login-box">
            <h1>🔐 تسجيل الدخول</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                    <div id="loginError" class="error"></div>
                </div>
                <button type="submit">دخول</button>
            </form>
        </div>
    </div>
    
    <!-- Editor Container -->
    <div id="editorContainer" class="editor-container">
        <div class="editor-header">
            <h1>✏️ تعديل الأسئلة</h1>
            <button class="logout-btn" id="logoutBtn">تسجيل خروج</button>
        </div>
        
        <div class="search-box">
            <input type="number" id="serialInput" placeholder="رقم السؤال" min="1">
            <select id="typeSelect">
                <option value="qd">أقسام (QD)</option>
                <option value="fq">اختبارات متكررة (FQ)</option>
            </select>
            <button id="searchBtn">بحث</button>
        </div>
        
        <div id="questionForm" class="question-form" style="display: none;">
            <div class="form-group">
                <label>رقم السؤال: <span id="serialDisplay"></span></label>
            </div>
            
            <div class="form-group">
                <label>نص السؤال</label>
                <textarea id="questionText" required></textarea>
            </div>
            
            <div class="form-group">
                <label>الخيارات</label>
                <div class="choices">
                    <div class="choice-input">
                        <span>أ)</span>
                        <input type="text" id="choice0" required>
                    </div>
                    <div class="choice-input">
                        <span>ب)</span>
                        <input type="text" id="choice1" required>
                    </div>
                    <div class="choice-input">
                        <span>ج)</span>
                        <input type="text" id="choice2" required>
                    </div>
                    <div class="choice-input">
                        <span>د)</span>
                        <input type="text" id="choice3" required>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label>الإجابة الصحيحة</label>
                <div class="answer-select">
                    <button type="button" class="answer-btn" data-ans="أ">أ</button>
                    <button type="button" class="answer-btn" data-ans="ب">ب</button>
                    <button type="button" class="answer-btn" data-ans="ج">ج</button>
                    <button type="button" class="answer-btn" data-ans="د">د</button>
                </div>
            </div>
            
            <button type="button" class="save-btn" id="saveBtn">💾 حفظ التعديل</button>
            <div id="saveStatus" class="status"></div>
        </div>
        
        <div id="loadingMsg" class="loading" style="display: none;">جاري البحث...</div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/+esm"></script>
    <script>
        const SUPABASE_URL = "https://ycumxatmtkpxjxmdpavb.supabase.co";
        const ANON_KEY = "sb_publishable_DSKPE2mURUAtmDGzhQQumQ_1dB5pFaD";
        const ADMIN_PASSWORD = "haha1234";
        
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, ANON_KEY);
        
        let currentSerialFetch = null;
        let selectedAnswer = null;
        
        // Login
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const pwd = document.getElementById("password").value;
            if (pwd === ADMIN_PASSWORD) {
                localStorage.setItem("qaisar_admin_session", "true");
                document.getElementById("loginContainer").style.display = "none";
                document.getElementById("editorContainer").classList.add("active");
            } else {
                document.getElementById("loginError").textContent = "كلمة المرور خاطئة";
            }
        });
        
        // Logout
        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.removeItem("qaisar_admin_session");
            location.reload();
        });
        
        // Check session on load
        if (!localStorage.getItem("qaisar_admin_session")) {
            document.getElementById("loginContainer").style.display = "flex";
        } else {
            document.getElementById("editorContainer").classList.add("active");
        }
        
        // Search question
        document.getElementById("searchBtn").addEventListener("click", async () => {
            const serial = parseInt(document.getElementById("serialInput").value);
            const type = document.getElementById("typeSelect").value;
            
            if (!serial) {
                alert("أدخل رقم السؤال");
                return;
            }
            
            document.getElementById("loadingMsg").style.display = "block";
            document.getElementById("questionForm").style.display = "none";
            currentSerialFetch = serial;
            
            try {
                const { data, error } = await supabase.rpc("get_question_data", {
                    p_serial: serial,
                    p_type: type
                });
                
                if (error) throw error;
                
                if (data) {
                    // Has override
                    populateForm(data);
                } else {
                    // Load from index.html embedded data
                    const qData = loadQuestionFromEmbedded(serial, type);
                    if (qData) {
                        populateForm(qData);
                    } else {
                        alert("السؤال غير موجود");
                    }
                }
            } catch (err) {
                console.error(err);
                alert("خطأ في البحث");
            } finally {
                document.getElementById("loadingMsg").style.display = "none";
            }
        });
        
        function loadQuestionFromEmbedded(serial, type) {
            // Try to load from the main page's embedded data
            const scriptId = type === "qd" ? `qd-${serial}` : `fq-${Math.ceil(serial / 50)}`;
            const script = document.getElementById(scriptId);
            if (!script) return null;
            
            try {
                const data = JSON.parse(script.textContent);
                if (data.q) {
                    const q = data.q.find(x => x.n === serial);
                    return q ? { serial, h: q.h, c: q.c, ans: q.ans } : null;
                }
            } catch (e) {
                console.error("Error parsing embedded data");
            }
            return null;
        }
        
        function populateForm(data) {
            document.getElementById("serialDisplay").textContent = data.serial;
            document.getElementById("questionText").value = data.h || "";
            if (data.c) {
                data.c.forEach((choice, i) => {
                    document.getElementById(`choice${i}`).value = choice || "";
                });
            }
            selectedAnswer = data.ans || null;
            updateAnswerButtons();
            document.getElementById("questionForm").style.display = "block";
        }
        
        // Answer selection
        document.querySelectorAll(".answer-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.preventDefault();
                selectedAnswer = e.target.dataset.ans;
                updateAnswerButtons();
            });
        });
        
        function updateAnswerButtons() {
            document.querySelectorAll(".answer-btn").forEach(btn => {
                btn.classList.toggle("selected", btn.dataset.ans === selectedAnswer);
            });
        }
        
        // Save
        document.getElementById("saveBtn").addEventListener("click", async () => {
            if (!selectedAnswer) {
                alert("اختر الإجابة الصحيحة");
                return;
            }
            
            const serial = currentSerialFetch;
            const type = document.getElementById("typeSelect").value;
            const h = document.getElementById("questionText").value;
            const c = [
                document.getElementById("choice0").value,
                document.getElementById("choice1").value,
                document.getElementById("choice2").value,
                document.getElementById("choice3").value
            ];
            const ans = selectedAnswer;
            
            if (!h || c.some(x => !x)) {
                alert("ملء جميع الحقول مطلوب");
                return;
            }
            
            try {
                const { data, error } = await supabase.rpc("save_question_override", {
                    p_serial: serial,
                    p_type: type,
                    p_h: h,
                    p_c: c,
                    p_ans: ans,
                    p_username: "qaisar"
                });
                
                if (error) throw error;
                
                const status = document.getElementById("saveStatus");
                status.textContent = "✅ تم الحفظ بنجاح!";
                status.className = "status success";
                setTimeout(() => status.className = "status", 3000);
            } catch (err) {
                console.error(err);
                const status = document.getElementById("saveStatus");
                status.textContent = "❌ خطأ في الحفظ";
                status.className = "status error";
            }
        });
    </script>
</body>
</html>
